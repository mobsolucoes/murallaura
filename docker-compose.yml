name: murallaura

services:
  postgres:
    image: postgres:16-alpine
    container_name: murallaura-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hashtagwall
    ports:
      - "8503:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hashtagwall"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    image: murallaura-api:local
    build:
      context: .
      dockerfile: Backend/Api/Dockerfile
    container_name: murallaura-api
    restart: unless-stopped
    environment:
      ASPNETCORE_URLS: http://84.247.141.109:8500
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=hashtagwall;Username=postgres;Password=postgres
      Jwt__Issuer: HashtagWall
      Jwt__Audience: HashtagWall
      Jwt__Key: CHANGE_ME_TO_A_STRONG_32_PLUS_CHAR_SECRET
      Jwt__ExpireMinutes: 480
      SeedAdmin__Username: admin
      SeedAdmin__Password: ChangeMe123!
      Cors__Origins__0: http://84.247.141.109:8501
      Cors__Origins__1: http://84.247.141.109:8502
      MetaOAuth__Enabled: "true"
      MetaOAuth__GraphApiVersion: v21.0
      MetaOAuth__RedirectUri: http://84.247.141.109:8500/api/public/meta/oauth/callback
      MetaOAuth__FrontendBaseUrl: http://84.247.141.109:8501
      MetaOAuth__AppId: CHANGE_ME
      MetaOAuth__AppSecret: CHANGE_ME
      MetaOAuth__Scopes: pages_show_list,instagram_basic,business_management
    ports:
      - "8500:8500"
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    image: murallaura-worker:local
    build:
      context: .
      dockerfile: Backend/Worker/Dockerfile
    container_name: murallaura-worker
    restart: unless-stopped
    environment:
      DOTNET_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=hashtagwall;Username=postgres;Password=postgres
      Jwt__Issuer: HashtagWall
      Jwt__Audience: HashtagWall
      Jwt__Key: CHANGE_ME_TO_A_STRONG_32_PLUS_CHAR_SECRET
      Jwt__ExpireMinutes: 480
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started

  admin:
    image: murallaura-admin:local
    build:
      context: .
      dockerfile: Frontend/admin/Dockerfile
    container_name: murallaura-admin
    restart: unless-stopped
    ports:
      - "8501:80"
    depends_on:
      api:
        condition: service_started

  wall:
    image: murallaura-wall:local
    build:
      context: .
      dockerfile: Frontend/wall/Dockerfile
    container_name: murallaura-wall
    restart: unless-stopped
    ports:
      - "8502:80"
    depends_on:
      api:
        condition: service_started

volumes:
  pgdata:
